<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Todo List by Villa</title>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1>Todo List</h1>
            <p>Organize your tasks</p>
        </div>
    </header>
    <main>
        <div class="action-container">
            <p>What Needs to be Done?</p>
            <button>+</button>
        </div>
        <nav class="filter-container">
            <button>All (0)</button>
            <button>Active (0)</button>
            <button>Completed (0)</button>
        </nav>
    </main>

</body>
</html>
